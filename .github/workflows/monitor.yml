name: Pemantau Anak Krakatau

on:
  schedule:
    - cron: "15 1 * * *"   # 01:15 UTC = 08:15 WIB setiap hari
  workflow_dispatch: {}      # tombol jalankan manual

permissions:
  contents: write            # untuk commit riwayat data & dashboard
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Uji
        run: python -m pytest tests/ -q

      - name: Seed riwayat bila data belum ada
        run: |
          if [ ! -f data/thermal.csv ]; then python seed.py; fi

      - name: Jalankan pemantau
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Commit riwayat & dashboard
        run: |
          git config user.name "krakatau-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thermal.csv data/so2.csv data/state.json dashboard.html
          git commit -m "monitor: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "tidak ada perubahan"
          git push

      - name: Siapkan artefak Pages
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
